echo "LISTEN SERVER CFG LOADED"
hostname "Mann vs. Machine | Classic Campaign "

// MvM 要求總玩家數 32（6真人 + 22機器人 + 4觀戰）。
// 注意：listenserver.cfg 在伺服器「已啟動後」才執行，
// 此時 maxplayers 已被鎖定無法更改（會出現
// "Cannot change maxplayers while the server is running"）。
// 請改用 mvmhost：主選單主控台輸入 exec mvmhost（或 mvmhost）

sv_password ""
rcon_password ""

sv_lan 0

sv_alltalk 0
sv_downloadurl "https://raw.githubusercontent.com/Single-BIOS/tf2classified-Map/main/tf2classified/"
sv_allowdownload 1
sv_allowupload 1
net_maxfilesize 256

mp_idlemaxtime 0
mp_idledealmethod 0
mp_allowspectators 1

// 投票：只允許 MvM 相關選項；nextlevel/mapcycle 只用已安裝的 MvM 圖
sv_allow_votes 1
sv_vote_issue_changelevel_allowed 1
sv_vote_issue_nextlevel_allowed 1
sv_vote_issue_extendlevel_allowed 1
sv_vote_issue_changelevel_allowed_mvm 1
sv_vote_issue_restart_game_allowed_mvm 1
sv_vote_issue_kick_allowed_mvm 1
sv_vote_issue_mvm_challenge_allowed 1
sv_vote_quorum_ratio 0

// 任務循環/投票清單（變更任務 面板與任務結束後續任務用）
tf_mvm_missioncyclefile "tf_mvm_missioncycle_tf2c.res"
mapcyclefile "mvm_mapcycle.txt"
tf_mm_servermode 2

// TEAM BALANCE
mp_autoteambalance 0
mp_teams_unbalance_limit 0

// NETWORK
sv_minrate 0
sv_maxrate 0

sv_minupdaterate 66
sv_maxupdaterate 66
sv_mincmdrate 66
sv_maxcmdrate 66

sv_client_min_interp_ratio 1
sv_client_max_interp_ratio 2

// PERFORMANCE
sv_parallel_packentities 1
sv_parallel_sendsnapshot 1
// 預載所有模型，避免 MvM 波次中間臨時載入造成卡頓（進圖較慢、記憶體增加）
sv_forcepreload 1
net_splitpacket_maxrate 30000
sv_max_snapshots_multiplier 2


// ROUND
mp_timelimit 0
mp_maxrounds 1
mp_winlimit 0

// MvM 設定（真人隊人數）
tf_mvm_defenders_team_size 6
tf_mvm_max_connected_players 6
tf_mvm_min_players_to_start 1

tf2c_allow_special_suicides 2