echo "===== AUTOEXEC LOADED ====="
rate 786432 
cl_cmdrate 66 
cl_updaterate 66 
cl_interp 0.015152  
cl_interp_ratio 1
cl_lagcompensation 1 
cl_predict 1 
cl_predictweapons 1 
mat_queue_mode 2 
r_threaded_particles 1 
r_threaded_renderables 1 
r_dynamic 0 
mat_motion_blur_enabled 0
fps_max 250
cl_smooth 1
cl_smoothtime 0.05
mat_disable_fancy_blending 1
r_drawtracers_firstperson 0
cl_disablehtmlmotd 1
mp_decals 50
r_maxmodeldecal 50
r_drawflecks 0

// MvM 開房捷徑：主選單主控台輸入 mvmhost
alias mvmhost "exec mvmhost"

// 投票快捷（遊戲內那兩個 重啟遊戲/變更地圖 按鈕是配對系統 UI，自架房無效，
// 改用以下：）
// F5 發起『重啟遊戲』投票；F6 房主直接重啟整場
alias v_restart_vote "callvote restart_game"
alias v_restart_now "mp_restartgame 2"
// F7 直接切到任務循環裡的『下一個任務』（含換難度）；F8 回到預設任務
alias v_next_mission "tf_mvm_nextmission"
alias v_default_mission "tf_mvm_popfile mvm_coaltown; changelevel mvm_coaltown"
bind F5 "v_restart_vote"
bind F6 "v_restart_now"
bind F7 "v_next_mission"
bind F8 "v_default_mission"